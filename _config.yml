# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve -l -H localhost`. If you change this file, please restart the
# server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default"
title                    : "Prof. Dr. Alim Al Ayub Ahmed"
title_separator          : "-"
name                     : &name "Prof. Dr. Alim Al Ayub Ahmed"
description              : &description "Academic and Research Profile of Prof. Dr. Alim Al Ayub Ahmed"
url                      : "https://alimalayubahmed.com"
baseurl                  : ""
repository               : "alimalayubahmed/alimalayubahmed.github.io"


# Site Author
# The following control what appears as part of the author content on the sidebar.
# If a field is blank the icon and link will not appear.
# Additional customization is handled in /_includes/author-profile.html

author:
  # Biographic information
  avatar           : "profile.png"
  name             : "Alim Al Ayub Ahmed"
  pronouns         :
  bio              : "Academic, researcher, editor, and consultant in digital scholarship & research visibility."
  location         :
  employer         : "Asian Business Consortium"

  # Primary contact
  uri              : "https://abc.us.org/"
  email            : "alim@abc.us.org"
  whatsapp         : "https://wa.me/447459660398"

  # Selected academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=azjOR68AAAAJ"
  scopus           : "https://www.scopus.com/authid/detail.uri?authorId=57218631949"
  webofscience     : "https://www.webofscience.com/wos/author/rid/B-2259-2015"
  orcid            : "https://orcid.org/0000-0003-4836-5423"

  # Academic websites not shown in sidebar
  academia         :
  arxiv            :
  inspire-hep      :
  impactstory      :
  semantic         :
  ssrn             :
  pubmed           :
  researchgate     :
  zotero           :

  # Repositories and software development
  bitbucket        :
  codepen          :
  dribbble         :
  github           : "alimalayubahmed"
  kaggle           :
  stackoverflow    :

  # Social media
  artstation       :
  bluesky          :
  facebook         :
  flickr           :
  foursquare       :
  goodreads        :
  google_plus      :
  keybase          :
  instagram        :
  lastfm           :
  linkedin         : draaaa76
  mastodon         :
  medium           :
  pinterest        :
  soundcloud       :
  steam            :
  telegram         :
  tumblr           :
  twitter          :
  vine             :
  weibo            :
  wikipedia        :
  xing             :
  youtube          :
  zhihu            :


# Publication Category
publication_category:
  books:
    title: 'Books'
  manuscripts:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'


# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :
  disqus:
    shortname            :
  discourse:
    server               :
  facebook:
    appid                :
    num_posts            :
    colorscheme          :

staticman:
  allowedFields          : ['name', 'email', 'url', 'message']
  branch                 : "gh-pages"
  commitMessage          : "New comment."
  filename               : comment-{@timestamp}
  format                 : "yml"
  moderation             : true
  path                   : "_data/comments/{options.slug}"
  requiredFields         : ['name', 'email', 'message']
  transforms:
    email                : "md5"
  generatedFields:
    date:
      type               : "date"
      options:
        format           : "iso8601"

atom_feed:
  hide                   : false
  path                   :


# SEO Related
google_site_verification :
bing_site_verification   :
alexa_site_verification  :
yandex_site_verification :


# Social Sharing
twitter:
  username               : &twitter

facebook:
  username               :
  app_id                 :
  publisher              :

og_image                 :
og_description           :

# Structured Academic Identity
social:
  type                   : "Person"
  name                   : "Prof. Dr. Alim Al Ayub Ahmed"
  links:
    - "https://orcid.org/0000-0003-4836-5423"
    - "https://scholar.google.com/citations?user=azjOR68AAAAJ"
    - "https://www.scopus.com/authid/detail.uri?authorId=57218631949"
    - "https://www.webofscience.com/wos/author/rid/B-2259-2015"
    - "https://ieee-collabratec.ieee.org/app/p/alimahmed"
    - "https://www.semanticscholar.org/author/Alim-Al-Ayub-Ahmed/30566020"
    - "https://papers.ssrn.com/sol3/cf_dev/AbsByAuth.cfm?per_id=2362304"
    - "https://www.linkedin.com/in/draaaa76/"
    - "https://github.com/alimalayubahmed"
    - "https://www.researchgate.net/profile/Alim_Al_Ayub_Ahmed"
    - "https://authors.repec.org/pro/pah225/"


# Analytics
analytics:
  provider               : "google-analytics-4"
  google:
    tracking_id          : "G-M92BY2YYL9"


# Reading Files
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/

  publications:
    output: true
    permalink: /:collection/:path/

  portfolio:
    output: true
    permalink: /:collection/:path/

  talks:
    output: true
    permalink: /:collection/:path/


# Defaults
defaults:

  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true

  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # _teaching
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true
      comment: true

  # _talks
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed


# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC


# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Mimic GitHub Pages with --safe
whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji


# Archives
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/


# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development